<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面走丢了</title>
<style>
  :root{--gold:#c9a961;--gold-dim:#8a7440;--bg:#161310;--fg:#f4eee2;--muted:#a89f8c;--line:rgba(201,169,97,.22)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
  .glow{position:fixed;left:50%;top:46%;width:520px;height:520px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,color-mix(in oklab,var(--gold) 12%,transparent),transparent 68%);filter:blur(70px);pointer-events:none}
  .eyebrow{font-size:10px;letter-spacing:.32em;color:var(--gold);opacity:.85;text-align:center}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(72px,15vw,150px);line-height:1;margin:8px 0 0;
    background:linear-gradient(180deg,#f7e9c8,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:13px;color:var(--muted);margin-top:10px;text-align:center;line-height:1.8;letter-spacing:.04em}

  #stage{margin-top:26px;width:min(860px,94vw);border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(180deg,rgba(201,169,97,.05),rgba(0,0,0,.12));position:relative;overflow:hidden}
  #game{display:block;width:100%;height:220px;touch-action:manipulation}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    background:rgba(22,19,16,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);cursor:pointer;text-align:center;padding:16px}
  #overlay.hide{display:none}
  #overlay .big{font-family:Georgia,serif;font-size:22px;color:var(--gold)}
  #overlay .small{font-size:12px;color:var(--muted);line-height:1.8}
  #score{position:absolute;top:10px;right:14px;font-family:Georgia,serif;font-size:14px;color:var(--gold);opacity:.9;letter-spacing:.1em}
  .tips{margin-top:14px;font-size:11px;color:var(--muted);text-align:center;line-height:1.9}
  .tips kbd{border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--gold);font-family:inherit;font-size:11px}
  .actions{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-size:13px;letter-spacing:.06em;
    text-decoration:none;transition:transform .25s,border-color .25s,color .25s}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#1a150e;border:1px solid var(--gold)}
  .btn-ghost{border:1px solid var(--line);color:var(--muted)}
  .btn:hover{transform:translateY(-2px)}
  .btn-ghost:hover{color:var(--gold);border-color:var(--gold)}
  .foot{position:absolute;bottom:16px;font-size:10px;color:var(--muted);opacity:.5;letter-spacing:.12em}
  @media(max-width:640px){#game{height:190px}.sub{font-size:12px}}
</style>
</head>
<body>
<div class="glow"></div>
<p class="eyebrow">404 · PAGE NOT FOUND</p>
<h1>404</h1>
<p class="sub">这个页面大概去旅行了。<br/>不如先陪小恐龙跑一会儿，等它回来。</p>

<div id="stage">
  <canvas id="game"></canvas>
  <div id="score">SCORE 0</div>
  <div id="overlay">
    <div class="big">准备奔跑</div>
    <div class="small">按 <kbd>空格</kbd> 或点击画面，让小恐龙跳起来<br/>躲开前面的障碍</div>
  </div>
</div>

<p class="tips">按 <kbd>空格</kbd> / <kbd>↑</kbd> / 点击屏幕 跳跃 · <kbd>R</kbd> 重新开始</p>
<div class="actions">
  <a class="btn btn-primary" href="/">返回首页</a>
  <a class="btn btn-ghost" href="/chat.html">去悄悄话</a>
</div>
<p class="foot">LYX STUDIO · 内蒙古包头</p>

<script>
(function(){
  var cv=document.getElementById('game'),ctx=cv.getContext('2d');
  var overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score');
  var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
  var GROUND_Y=0,started=false,dead=false,score=0,best=0;
  var dino={x:70,y:0,w:44,h:46,vy:0,jumping:false,frame:0};
  var obstacles=[],clouds=[],ticks=0,speed=6.4,speedUp=0;

  function resize(){
    var r=cv.getBoundingClientRect();W=r.width;H=r.height;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);GROUND_Y=H-42;
    if(!dino.y)dino.y=GROUND_Y-dino.h;
  }
  window.addEventListener('resize',resize);resize();

  // 像素恐龙（用矩形拼，风格贴近谷歌离线恐龙）
  function drawDino(){
    var x=Math.round(dino.x),y=Math.round(dino.y),u=3,c='#c9a961',c2='#8a7440';
    // 身体
    ctx.fillStyle=c;
    ctx.fillRect(x+9*u,y+6*u,8*u,7*u);   // 躯干
    ctx.fillRect(x+13*u,y+2*u,6*u,5*u);   // 头
    ctx.fillRect(x+17*u,y+3*u,3*u,2*u);   // 嘴
    ctx.fillRect(x+7*u,y+3*u,2*u,3*u);    // 尾
    ctx.fillRect(x+11*u,y+13*u,3*u,5*u);  // 腿
    ctx.fillRect(x+16*u,y+13*u,3*u,5*u);
    ctx.fillStyle=c2;
    ctx.fillRect(x+16*u,y+3*u,1*u,1*u);   // 眼
    if(!dino.jumping&&Math.floor(dino.frame/7)%2===0){
      ctx.fillStyle=c2;ctx.fillRect(x+11*u,y+18*u,3*u,2*u);ctx.fillRect(x+16*u,y+18*u,3*u,2*u);
    }
  }
  function drawCactus(o){
    var c='#a88f55',u=3,x=Math.round(o.x),y=Math.round(GROUND_Y-o.h);
    ctx.fillStyle=c;
    ctx.fillRect(x+3*u,y,3*u,o.h);
    ctx.fillRect(x,y+7*u,3*u,5*u);
    ctx.fillRect(x+6*u,y+4*u,3*u,5*u);
  }
  function drawCloud(cl){
    ctx.fillStyle='rgba(201,169,97,.10)';
    ctx.fillRect(cl.x,cl.y,34,8);ctx.fillRect(cl.x+8,cl.y-7,20,8);
  }
  function jump(){
    if(dead)return;
    if(!started){started=true;overlay.classList.add('hide');}
    if(!dino.jumping){dino.vy=-13.5;dino.jumping=true;}
  }
  function reset(){
    dead=false;started=true;score=0;speed=6.4;speedUp=0;obstacles=[];
    dino.y=GROUND_Y-dino.h;dino.vy=0;dino.jumping=false;dino.frame=0;
    overlay.classList.add('hide');scoreEl.textContent='SCORE 0';
  }
  function tick(){
    if(!dead){
      ticks++;dino.frame++;
      if(started){
        score+=speed*0.055;speedUp++;
        if(speedUp%180===0)speed=Math.min(12.5,speed+0.45);
        if(ticks%Math.max(46,Math.round(100-speed*4))===0){
          var tall=Math.random()>0.45;
          obstacles.push({x:W+20,h:tall?46:32});
        }
        for(var i=obstacles.length-1;i>=0;i--){
          var o=obstacles[i];o.x-=speed;
          // 碰撞盒（留一点宽容度）
          var dx=dino.x+8, dw=dino.w-16;
          if(o.x<dx+dw&&o.x+12>dx&&dino.y+dino.h-4>GROUND_Y-o.h+3){
            dead=true;overlay.classList.remove('hide');
            overlay.querySelector('.big').textContent='撞到了';
            overlay.querySelector('.small').innerHTML='本次得分 '+Math.floor(score)+' · 最高 '+best+'<br/>点击画面或按 <kbd>空格</kbd> 再来一次';
            break;
          }
          if(o.x<-30)obstacles.splice(i,1);
        }
      }
      // 物理
      dino.vy+=0.72;dino.y+=dino.vy;
      if(dino.y>=GROUND_Y-dino.h){dino.y=GROUND_Y-dino.h;dino.vy=0;dino.jumping=false;}
      // 云
      if(ticks%140===0)clouds.push({x:W+20,y:30+Math.random()*60});
      clouds.forEach(function(c){c.x-=speed*0.28;});clouds=clouds.filter(function(c){return c.x>-60;});
      scoreEl.textContent='SCORE '+Math.floor(score);
      best=Math.max(best,Math.floor(score));
    }
    // 绘制
    ctx.clearRect(0,0,W,H);
    clouds.forEach(drawCloud);
    ctx.strokeStyle='rgba(201,169,97,.28)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,GROUND_Y+1);ctx.lineTo(W,GROUND_Y+1);ctx.stroke();
    var seg=Math.floor(ticks*speed/24)%40;
    ctx.strokeStyle='rgba(201,169,97,.12)';
    for(var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x-seg,GROUND_Y+7);ctx.lineTo(x-seg+16,GROUND_Y+7);ctx.stroke();}
    obstacles.forEach(drawCactus);drawDino();
    requestAnimationFrame(tick);
  }
  tick();

  document.addEventListener('keydown',function(e){
    if(e.code==='Space'||e.code==='ArrowUp'){
      e.preventDefault();
      if(dead)reset();else jump();
    }else if(e.key==='r'||e.key==='R'){reset();}
  });
  cv.addEventListener('pointerdown',function(e){e.preventDefault();if(dead)reset();else jump();});
  overlay.addEventListener('click',function(){if(dead)reset();else jump();});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>3D 硬币物理模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  #app { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: absolute;
    top: 16px;
    right: 16px;
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 18px;
    font-weight: 600;
    pointer-events: none;
    user-select: none;
  }
  #hud .label { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
  #hud .amount { font-size: 24px; color: #ffd700; }

  #tips {
    position: absolute;
    bottom: 16px;
    left: 16px;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 8px;
    color: rgba(255, 255, 255, 0.7);
    font-family: "PingFang SC", sans-serif;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    user-select: none;
  }

  #hint {
    position: absolute;
    bottom: 16px;
    right: 16px;
    padding: 10px 14px;
    background: rgba(255, 215, 0, 0.1);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 8px;
    color: rgba(255, 215, 0, 0.8);
    font-family: "PingFang SC", sans-serif;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
    user-select: none;
  }

  #gyroBtn {
    position: absolute;
    bottom: 16px;
    right: 16px;
    padding: 10px 18px;
    background: rgba(255, 215, 0, 0.2);
    border: 1px solid rgba(255, 215, 0, 0.5);
    border-radius: 8px;
    color: #ffd700;
    font-family: "PingFang SC", sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: none;
  }
  #gyroBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="label">总金额</div>
    <div class="amount" id="amountText">¥5.8 元</div>
  </div>
  <div id="tips">
    桌面端：左键拖拽拾取 · 右键旋转视角<br/>
    长按木板拖动，硬币物理散开<br/>
    移动端：单指拖拽拾取 · 双指旋转视角
  </div>
  <div id="hint">💡 长按木板可拖动</div>
  <button id="gyroBtn">启用陀螺仪</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as CANNON from 'cannon-es';

const COIN_CONFIG = {
  yuan: { radius: 1.3, thickness: 0.25, mass: 8, value: 1.0, count: 5, color: 0xc0c0c0 },
  jiao: { radius: 0.9, thickness: 0.15, mass: 3, value: 0.1, count: 8, color: 0xb87333 }
};
const TABLE_SIZE = { w: 16, h: 12, thickness: 0.3 };
const GRAVITY = new CANNON.Vec3(0, -9.82, 0);

const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 60);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(12, 14, 18);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(8, 18, 6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -20;
dirLight.shadow.camera.right = 20;
dirLight.shadow.camera.top = 20;
dirLight.shadow.camera.bottom = -20;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
fillLight.position.set(-8, 10, -6);
scene.add(fillLight);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 5;
controls.maxDistance = 50;
controls.maxPolarAngle = Math.PI * 0.48;
controls.mouseButtons = {
  LEFT: null,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.ROTATE
};
controls.touches = {
  ONE: null,
  TWO: THREE.TOUCH.DOLLY_PAN
};
controls.target.set(0, 1, 0);

const world = new CANNON.World({ gravity: GRAVITY });
world.broadphase = new CANNON.NaiveBroadphase();
world.allowSleep = false;
world.solver.iterations = 30;
world.defaultContactMaterial.friction = 0.4;
world.defaultContactMaterial.restitution = 0.3;

const tableGeometry = new THREE.BoxGeometry(TABLE_SIZE.w, TABLE_SIZE.thickness, TABLE_SIZE.h);
const tableCanvas = createTableTexture();
const tableTexture = new THREE.CanvasTexture(tableCanvas);
const tableMaterial3D = new THREE.MeshStandardMaterial({
  map: tableTexture,
  roughness: 0.6,
  metalness: 0.1,
  transparent: true,
  opacity: 0.85
});
const tableMesh = new THREE.Mesh(tableGeometry, tableMaterial3D);
tableMesh.position.set(0, -TABLE_SIZE.thickness / 2, 0);
tableMesh.receiveShadow = true;
scene.add(tableMesh);

const tableBody = new CANNON.Body({
  mass: 0,
  shape: new CANNON.Box(new CANNON.Vec3(TABLE_SIZE.w / 2, TABLE_SIZE.thickness / 2, TABLE_SIZE.h / 2))
});
tableBody.position.set(0, -TABLE_SIZE.thickness / 2, 0);
world.addBody(tableBody);

const groundBody = new CANNON.Body({
  mass: 0,
  shape: new CANNON.Plane()
});
groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
groundBody.position.set(0, -5, 0);
world.addBody(groundBody);

function createTableTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 768;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, 0, 1024, 768);
  grad.addColorStop(0, '#5a3a22');
  grad.addColorStop(0.3, '#6b4428');
  grad.addColorStop(0.6, '#5a3a22');
  grad.addColorStop(1, '#4a2e1a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1024, 768);

  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 15; i++) {
    ctx.beginPath();
    const y = (i / 15) * 768;
    ctx.moveTo(0, y);
    for (let x = 0; x <= 1024; x += 20) {
      ctx.lineTo(x, y + Math.sin(x * 0.02 + i) * 8);
    }
    ctx.stroke();
  }

  const edgeGrad = ctx.createRadialGradient(512, 384, 200, 512, 384, 600);
  edgeGrad.addColorStop(0, 'rgba(255,220,180,0)');
  edgeGrad.addColorStop(1, 'rgba(0,0,0,0.3)');
  ctx.fillStyle = edgeGrad;
  ctx.fillRect(0, 0, 1024, 768);

  return canvas;
}

function createCoinTexture(type, face) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  const radius = 500;

  ctx.save();
  ctx.beginPath();
  ctx.arc(512, 512, radius, 0, Math.PI * 2);
  ctx.clip();

  const baseGrad = ctx.createRadialGradient(512, 512, 40, 512, 512, radius);
  if (type === 'yuan') {
    baseGrad.addColorStop(0, '#f0f0f0');
    baseGrad.addColorStop(0.3, '#d8d8d8');
    baseGrad.addColorStop(0.6, '#b8b8b8');
    baseGrad.addColorStop(1, '#888888');
  } else {
    baseGrad.addColorStop(0, '#e8b574');
    baseGrad.addColorStop(0.3, '#c88844');
    baseGrad.addColorStop(0.6, '#a8682c');
    baseGrad.addColorStop(1, '#7a4820');
  }
  ctx.fillStyle = baseGrad;
  ctx.fillRect(0, 0, 1024, 1024);

  const shineGrad = ctx.createRadialGradient(350, 300, 30, 512, 512, 600);
  shineGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
  shineGrad.addColorStop(0.4, 'rgba(255,255,255,0.1)');
  shineGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = shineGrad;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.restore();

  ctx.strokeStyle = type === 'yuan' ? '#505050' : '#4a2a10';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.arc(512, 512, radius - 8, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = type === 'yuan' ? '#707070' : '#6a3a20';
  ctx.lineWidth = 4;
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.arc(512, 512, radius - 28, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = type === 'yuan' ? '#606060' : '#5a3018';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(512, 512, radius - 38, 0, Math.PI * 2);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = type === 'yuan' ? '#1a1a1a' : '#1a0f05';

  if (type === 'yuan') {
    ctx.font = 'bold 320px "KaiTi", "STKaiti", "华文行楷", "华文楷体", serif';
    ctx.fillText('1', 300, 400);

    ctx.font = 'bold 320px "KaiTi", "STKaiti", "华文行楷", "华文楷体", serif';
    ctx.fillText('元', 730, 400);

    ctx.font = 'bold 60px "Arial Black", "Arial", sans-serif';
    ctx.fillText('YI YUAN', 512, 700);
  } else {
    if (face === 'front') {
      ctx.font = 'bold 240px "KaiTi", "STKaiti", "华文行楷", "华文楷体", serif';
      ctx.fillText('1', 340, 380);

      ctx.font = 'bold 240px "KaiTi", "STKaiti", "华文行楷", "华文楷体", serif';
      ctx.fillText('角', 680, 380);

      ctx.font = 'bold 48px "Arial Black", "Arial", sans-serif';
      ctx.fillText('JIAO', 512, 620);
    } else {
      ctx.font = 'bold 180px "KaiTi", "STKaiti", "华文行楷", "华文楷体", serif';
      ctx.fillText('1角', 512, 512);
    }
  }

  const finalShine = ctx.createLinearGradient(200, 200, 800, 800);
  finalShine.addColorStop(0, 'rgba(255,255,255,0.2)');
  finalShine.addColorStop(0.5, 'rgba(255,255,255,0)');
  finalShine.addColorStop(1, 'rgba(0,0,0,0.1)');
  ctx.fillStyle = finalShine;
  ctx.beginPath();
  ctx.arc(512, 512, radius - 10, 0, Math.PI * 2);
  ctx.fill();

  return canvas;
}

const coinMeshes = [];
const coinBodies = [];
const coinData = [];

function createCoin(type, position) {
  const config = COIN_CONFIG[type];
  const geometry = new THREE.CylinderGeometry(config.radius, config.radius, config.thickness, 48);

  const frontCanvas = createCoinTexture(type, 'front');
  const backCanvas = createCoinTexture(type, 'back');
  const frontTexture = new THREE.CanvasTexture(frontCanvas);
  const backTexture = new THREE.CanvasTexture(backCanvas);

  frontTexture.anisotropy = 8;
  frontTexture.colorSpace = THREE.SRGBColorSpace;
  frontTexture.flipY = false;
  backTexture.anisotropy = 8;
  backTexture.colorSpace = THREE.SRGBColorSpace;
  backTexture.flipY = false;

  const sideMaterial = new THREE.MeshStandardMaterial({
    color: config.color,
    roughness: 0.4,
    metalness: 0.5
  });
  const frontMaterial = new THREE.MeshStandardMaterial({
    map: frontTexture,
    color: 0xffffff,
    roughness: 0.45,
    metalness: 0.1
  });
  const backMaterial = new THREE.MeshStandardMaterial({
    map: backTexture,
    color: 0xffffff,
    roughness: 0.5,
    metalness: 0.1
  });

  const materials = [sideMaterial, frontMaterial, backMaterial];
  const mesh = new THREE.Mesh(geometry, materials);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const body = new CANNON.Body({
    mass: config.mass,
    shape: new CANNON.Box(new CANNON.Vec3(config.radius, config.thickness / 2, config.radius)),
    linearDamping: 0.3,
    angularDamping: 0.4
  });

  body.position.set(position.x, position.y, position.z);

  body.addEventListener('collide', (e) => {
    const impact = e.contact.getImpactVelocityAlongNormal();
    if (impact > 0.5) {
      playCoinSound(impact);
    }
  });

  world.addBody(body);
  scene.add(mesh);

  const data = { type, value: config.value, mesh, body };
  coinMeshes.push(mesh);
  coinBodies.push(body);
  coinData.push(data);

  return data;
}

function initCoins() {
  const allCoins = [
    ...Array(COIN_CONFIG.yuan.count).fill('yuan'),
    ...Array(COIN_CONFIG.jiao.count).fill('jiao')
  ];

  for (let i = allCoins.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [allCoins[i], allCoins[j]] = [allCoins[j], allCoins[i]];
  }

  const placed = [];
  allCoins.forEach((type) => {
    const config = COIN_CONFIG[type];
    let x, z, attempts = 0;
    do {
      x = (Math.random() - 0.5) * (TABLE_SIZE.w - config.radius * 2 - 2);
      z = (Math.random() - 0.5) * (TABLE_SIZE.h - config.radius * 2 - 2);
      attempts++;
    } while (attempts < 20 && placed.some(p => {
      const dx = p.x - x, dz = p.z - z;
      const minDist = p.radius + config.radius + 0.3;
      return dx * dx + dz * dz < minDist * minDist;
    }));

    placed.push({ x, z, radius: config.radius });
    const y = config.thickness / 2 + Math.random() * 3 + 4;
    createCoin(type, { x, y, z });
  });
}

initCoins();

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playCoinSound(impactVelocity) {
  ensureAudio();
  if (!audioCtx) return;

  const vol = Math.min(0.15, impactVelocity * 0.04);

  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(2800 + Math.random() * 400, audioCtx.currentTime);
  osc1.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
  gain1.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
  osc1.connect(gain1).connect(audioCtx.destination);
  osc1.start();
  osc1.stop(audioCtx.currentTime + 0.15);

  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();
  osc2.type = 'triangle';
  osc2.frequency.setValueAtTime(5200 + Math.random() * 600, audioCtx.currentTime);
  gain2.gain.setValueAtTime(vol * 0.3, audioCtx.currentTime);
  gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
  osc2.connect(gain2).connect(audioCtx.destination);
  osc2.start();
  osc2.stop(audioCtx.currentTime + 0.08);

  const bufferSize = audioCtx.sampleRate * 0.04;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = audioCtx.createGain();
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'highpass';
  noiseFilter.frequency.value = 3000;
  noiseGain.gain.setValueAtTime(vol * 0.4, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  noise.connect(noiseFilter).connect(noiseGain).connect(audioCtx.destination);
  noise.start();
}

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

let pickedCoin = null;
let pickPlane = new THREE.Plane();
let pickOffset = new THREE.Vector3();
let dragTarget = new THREE.Vector3();
let pickInitialQuat = null;

let pickedTable = false;
let tableDragPlane = new THREE.Plane();
let tableDragOffset = new THREE.Vector3();
let tableLastPos = new THREE.Vector3();
let tableDragActive = false;
let tableLongPressTimer = null;
let tablePressMovedFar = false;
const TABLE_LONG_PRESS_MS = 300;
const TABLE_MOVE_THRESHOLD = 25;

function getPointer(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const point = e.touches ? e.touches[0] : e;
  pointer.x = ((point.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((point.clientY - rect.top) / rect.height) * 2 + 1;
}

function tryPickCoin() {
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObjects(coinMeshes, false);
  if (intersects.length > 0) {
    const hitMesh = intersects[0].object;
    const index = coinMeshes.indexOf(hitMesh);
    if (index >= 0) {
      pickedCoin = coinData[index];
      pickedCoin.body.type = CANNON.Body.KINEMATIC;
      pickedCoin.body.velocity.set(0, 0, 0);
      pickedCoin.body.angularVelocity.set(0, 0, 0);
      const q = pickedCoin.body.quaternion;
      pickInitialQuat = { x: q.x, y: q.y, z: q.z, w: q.w };

      const normal = new THREE.Vector3();
      camera.getWorldDirection(normal);
      pickPlane.setFromNormalAndCoplanarPoint(normal, hitMesh.position);

      const intersection = new THREE.Vector3();
      if (raycaster.ray.intersectPlane(pickPlane, intersection)) {
        pickOffset.copy(intersection).sub(hitMesh.position);
      }
      return true;
    }
  }
  return false;
}

function tryPickTable() {
  raycaster.setFromCamera(pointer, camera);
  const intersects = raycaster.intersectObject(tableMesh, false);
  if (intersects.length > 0) {
    const hitPoint = intersects[0].point;
    const normal = new THREE.Vector3(0, 1, 0);
    tableDragPlane.setFromNormalAndCoplanarPoint(normal, hitPoint);
    tableDragOffset.copy(hitPoint).sub(tableBody.position);
    tableLastPos.copy(tableBody.position);
    tablePressMovedFar = false;
    return true;
  }
  return false;
}

function startTableDrag() {
  if (!tableDragActive) {
    tableDragActive = true;
    pickedTable = true;
    tableBody.type = CANNON.Body.KINEMATIC;
    tableBody.velocity.set(0, 0, 0);
    tableLastPos.copy(tableBody.position);
    controls.enabled = false;
  }
}

function updateCoinDrag() {
  if (!pickedCoin) return;
  raycaster.setFromCamera(pointer, camera);
  const intersection = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(pickPlane, intersection)) {
    intersection.sub(pickOffset);
    intersection.y = Math.max(intersection.y, 0.5);

    const radius = COIN_CONFIG[pickedCoin.type].radius;
    const margin = radius + 0.3;
    const tcx = tableBody.position.x;
    const tcz = tableBody.position.z;
    intersection.x = Math.max(tcx - TABLE_SIZE.w / 2 + margin, Math.min(tcx + TABLE_SIZE.w / 2 - margin, intersection.x));
    intersection.z = Math.max(tcz - TABLE_SIZE.h / 2 + margin, Math.min(tcz + TABLE_SIZE.h / 2 - margin, intersection.z));

    dragTarget.copy(intersection);
    pickedCoin.body.position.set(intersection.x, intersection.y, intersection.z);
    if (pickInitialQuat) {
      pickedCoin.body.quaternion.set(pickInitialQuat.x, pickInitialQuat.y, pickInitialQuat.z, pickInitialQuat.w);
    }
  }
}

function updateTableDrag() {
  if (!tableDragActive) return;
  raycaster.setFromCamera(pointer, camera);
  const intersection = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(tableDragPlane, intersection)) {
    intersection.sub(tableDragOffset);

    const maxX = 30, maxZ = 20;
    intersection.x = Math.max(-maxX, Math.min(maxX, intersection.x));
    intersection.z = Math.max(-maxZ, Math.min(maxZ, intersection.z));
    intersection.y = -TABLE_SIZE.thickness / 2;

    const newPos = new THREE.Vector3(intersection.x, intersection.y, intersection.z);
    const delta = new THREE.Vector3().subVectors(newPos, tableLastPos);
    const dt = 1 / 60;
    tableBody.velocity.set(delta.x / dt, delta.y / dt, delta.z / dt);
    tableBody.position.set(intersection.x, intersection.y, intersection.z);
    tableLastPos.copy(newPos);
  }
}

function releaseCoin() {
  if (!pickedCoin) return;
  pickedCoin.body.type = CANNON.Body.DYNAMIC;
  if (pickedCoin.body.mass === 0) {
    pickedCoin.body.mass = COIN_CONFIG[pickedCoin.type].mass;
  }
  pickedCoin.body.velocity.set(0, 0, -0.5);
  pickedCoin.body.wakeUp();
  pickedCoin = null;
  pickInitialQuat = null;
}

function releaseTable() {
  if (!tableDragActive) return;
  tableDragActive = false;
  pickedTable = false;

  const vx = tableBody.velocity.x;
  const vz = tableBody.velocity.z;

  tableBody.velocity.set(0, 0, 0);
  tableBody.type = CANNON.Body.STATIC;

  for (let i = 0; i < coinBodies.length; i++) {
    const body = coinBodies[i];
    body.velocity.set(
      body.velocity.x + vx * 0.3,
      body.velocity.y,
      body.velocity.z + vz * 0.3
    );
    body.wakeUp();
  }

  controls.enabled = true;
}

renderer.domElement.addEventListener('mousedown', (e) => {
  ensureAudio();
  if (e.button === 0 && !tableDragActive) {
    getPointer(e);
    if (tryPickCoin()) {
      clearTableLongPress();
    } else if (tryPickTable()) {
      tablePressStartX = e.clientX;
      tablePressStartY = e.clientY;
      scheduleTableLongPress();
    }
    e.preventDefault();
  }
});

renderer.domElement.addEventListener('mousemove', (e) => {
  getPointer(e);
  if (pickedCoin) {
    updateCoinDrag();
  } else if (tableDragActive) {
    updateTableDrag();
  } else if (tableLongPressTimer) {
    const dx = e.clientX - tablePressStartX;
    const dy = e.clientY - tablePressStartY;
    if (Math.sqrt(dx * dx + dy * dy) > TABLE_MOVE_THRESHOLD) {
      tablePressMovedFar = true;
      clearTableLongPress();
    }
  }
});

renderer.domElement.addEventListener('mouseup', (e) => {
  if (e.button === 0) {
    if (pickedCoin) {
      releaseCoin();
    }
    if (tableDragActive) {
      releaseTable();
    }
    clearTableLongPress();
  }
});

renderer.domElement.addEventListener('mouseleave', () => {
  if (pickedCoin) {
    releaseCoin();
  }
  if (tableDragActive) {
    releaseTable();
  }
  clearTableLongPress();
});

renderer.domElement.addEventListener('touchstart', (e) => {
  ensureAudio();
  if (e.touches.length === 1 && !tableDragActive) {
    getPointer(e);
    if (tryPickCoin()) {
      clearTableLongPress();
    } else if (tryPickTable()) {
      tablePressStartX = e.touches[0].clientX;
      tablePressStartY = e.touches[0].clientY;
      scheduleTableLongPress();
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', (e) => {
  if (e.touches.length === 1) {
    getPointer(e);
    if (pickedCoin) {
      updateCoinDrag();
    } else if (tableDragActive) {
      updateTableDrag();
    } else if (tableLongPressTimer) {
      const dx = e.touches[0].clientX - tablePressStartX;
      const dy = e.touches[0].clientY - tablePressStartY;
      if (Math.sqrt(dx * dx + dy * dy) > TABLE_MOVE_THRESHOLD) {
        tablePressMovedFar = true;
        clearTableLongPress();
      }
    }
  }
}, { passive: true });

renderer.domElement.addEventListener('touchend', () => {
  if (pickedCoin) {
    releaseCoin();
  }
  if (tableDragActive) {
    releaseTable();
  }
  clearTableLongPress();
});

renderer.domElement.addEventListener('touchcancel', () => {
  if (pickedCoin) {
    releaseCoin();
  }
  if (tableDragActive) {
    releaseTable();
  }
  clearTableLongPress();
});

function scheduleTableLongPress() {
  clearTableLongPress();
  tableLongPressTimer = setTimeout(() => {
    if (!pickedCoin && !tablePressMovedFar) {
      startTableDrag();
    }
    tableLongPressTimer = null;
  }, TABLE_LONG_PRESS_MS);
}

function clearTableLongPress() {
  if (tableLongPressTimer) {
    clearTimeout(tableLongPressTimer);
    tableLongPressTimer = null;
  }
}

let tablePressStartX = 0;
let tablePressStartY = 0;

renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

let gyroEnabled = false;
let gyroBeta = 0;
let gyroGamma = 0;

function handleOrientation(e) {
  gyroBeta = e.beta || 0;
  gyroGamma = e.gamma || 0;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === 'granted') {
          startGyro();
        }
      })
      .catch(() => {
        alert('无法获取陀螺仪权限');
      });
  } else {
    startGyro();
  }
}

function startGyro() {
  window.addEventListener('deviceorientation', handleOrientation);
  gyroEnabled = true;
  document.getElementById('gyroBtn').style.display = 'none';
}

function updateGravityFromGyro() {
  if (!gyroEnabled) return;

  const betaRad = (gyroBeta * Math.PI) / 180;
  const gammaRad = (gyroGamma * Math.PI) / 180;

  const g = 9.82;
  let gx = Math.sin(gammaRad) * g;
  let gy = -Math.cos(gammaRad) * g;
  let gz = Math.sin(betaRad) * g;

  gy = Math.min(gy, -2);

  world.gravity.set(gx, gy, gz);
}

if (typeof DeviceOrientationEvent !== 'undefined' &&
    typeof DeviceOrientationEvent.requestPermission === 'function') {
  document.getElementById('gyroBtn').style.display = 'block';
  document.getElementById('gyroBtn').addEventListener('click', enableGyro);
} else if (window.DeviceOrientationEvent) {
  startGyro();
}

const amountText = document.getElementById('amountText');

function updateAmountDisplay() {
  let total = 0;
  coinData.forEach(c => { total += c.value; });
  amountText.textContent = `¥${total.toFixed(1)} 元`;
}

updateAmountDisplay();

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onWindowResize);

const clock = new THREE.Clock();
let lastTime = 0;
const fixedTimeStep = 1 / 60;
const maxSubSteps = 4;

function animate(time) {
  requestAnimationFrame(animate);

  const delta = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  updateGravityFromGyro();

  // 安全兜底：确保所有非picked的硬币都是DYNAMIC状态且有质量
  for (let i = 0; i < coinBodies.length; i++) {
    const body = coinBodies[i];
    if (pickedCoin && body === pickedCoin.body) continue;
    if (body.type !== CANNON.Body.DYNAMIC || body.mass === 0) {
      body.type = CANNON.Body.DYNAMIC;
      if (body.mass === 0) body.mass = coinData[i].type === 'yuan' ? 8 : 3;
      body.wakeUp();
    }
  }

  world.step(fixedTimeStep, delta, tableDragActive ? 8 : maxSubSteps);

  tableMesh.position.copy(tableBody.position);
  tableMesh.quaternion.copy(tableBody.quaternion);

  const tcx = tableBody.position.x;
  const tcz = tableBody.position.z;

  for (let i = 0; i < coinMeshes.length; i++) {
    const mesh = coinMeshes[i];
    const body = coinBodies[i];
    const coin = coinData[i];

    const radius = COIN_CONFIG[coin.type].radius;
    const halfThick = COIN_CONFIG[coin.type].thickness / 2;
    const margin = radius + 0.15;
    const minY = halfThick + 0.01;

    if (!tableDragActive) {
      const minX = tcx - TABLE_SIZE.w / 2 + margin;
      const maxX = tcx + TABLE_SIZE.w / 2 - margin;
      const minZ = tcz - TABLE_SIZE.h / 2 + margin;
      const maxZ = tcz + TABLE_SIZE.h / 2 - margin;

      if (body.position.x < minX) { body.position.x = minX; body.velocity.x = Math.abs(body.velocity.x) * 0.2; }
      if (body.position.x > maxX) { body.position.x = maxX; body.velocity.x = -Math.abs(body.velocity.x) * 0.2; }
      if (body.position.z < minZ) { body.position.z = minZ; body.velocity.z = Math.abs(body.velocity.z) * 0.2; }
      if (body.position.z > maxZ) { body.position.z = maxZ; body.velocity.z = -Math.abs(body.velocity.z) * 0.2; }

      const withinX = body.position.x > minX && body.position.x < maxX;
      const withinZ = body.position.z > minZ && body.position.z < maxZ;
      if (withinX && withinZ && body.position.y < minY) {
        body.position.y = minY;
        body.velocity.y = Math.max(0, body.velocity.y) * 0.2;
      }
    }

    mesh.position.copy(body.position);
    mesh.quaternion.copy(body.quaternion);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate(performance.now());

window.__coinSim = { scene, camera, renderer, controls, world, coinData, tryPickCoin, releaseCoin, tryPickTable, startTableDrag, tableBody, tableMesh, THREE, CANNON };
</script>
</body>
</html>

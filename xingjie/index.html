<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<script src="/assets/qh-log.js" data-page="xingjie" data-ver="2026.11.28.1"></script>
<script>window.qhAct=window.qhAct||function(){};</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>星界审判：自由意志的曙光</title>
<style>
  :root { --bg: #0b0e17; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #frame {
    position: relative;
    width: min(100vw, calc(100vh * 1.3333333333));
    aspect-ratio: 960 / 720;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  #stage { width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  #bubbleLayer { position: absolute; inset: 0; pointer-events: none; }
  .bubble {
    position: absolute; background: #fff; color: #333; border: 2px solid #333;
    border-radius: 14px; padding: 10px 14px; font-size: 14px; max-width: 440px;
    min-width: 80px; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); white-space: pre-wrap; word-break: break-word;
    transform: translateX(-50%);
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #333; }
  #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: center; justify-content: center; z-index: 10; }
  .dlg { background: #fff; border-radius: 16px; padding: 20px; width: 82%; max-width: 400px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .dlg-q { font-size: 15px; color: #222; margin-bottom: 14px; word-break: break-word; white-space: pre-wrap; }
  .dlg-input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 12px; outline: none; }
  .dlg-input:focus { border-color: #6a8bff; }
  .dlg-btn { display: block; width: 100%; padding: 11px; font-size: 15px; border: none; border-radius: 10px; background: #5b7cfa; color: #fff; cursor: pointer; margin-top: 8px; }
  .dlg-btn:hover { background: #4a6af0; }
  .dlg-btn.choice { background: #fff; color: #333; border: 1.5px solid #5b7cfa; }
  .dlg-btn.choice:hover { background: #eef2ff; }
  #rankingPanel { position: absolute; right: 10px; top: 60px; background: rgba(255,255,255,0.95); border: 2px solid #333; border-radius: 12px; padding: 12px 16px; display: none; min-width: 160px; font-size: 14px; color: #222; z-index: 5; }
  #timerDisplay { position: absolute; left: 10px; top: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 14px; padding: 4px 8px; border-radius: 6px; display: none; font-variant-numeric: tabular-nums; }
  #varBox { position: absolute; left: 10px; top: 10px; display: none; z-index: 4; }
  .var { background: rgba(0,0,0,0.65); color: #fff; font-size: 13px; padding: 4px 9px; border-radius: 6px; margin-bottom: 5px; }
  .var span { opacity: 0.85; margin-right: 4px; }
  #loading {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #0b0e17; color: #fff; z-index: 20; gap: 14px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; opacity: 0.85; }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="stage"></canvas>
    <div id="bubbleLayer"></div>
    <div id="varBox"></div>
    <div id="timerDisplay"></div>
    <div id="rankingPanel"><h3>排行榜</h3><div id="rankingBody"></div></div>
    <div id="overlay"></div>
    <div id="loading"><div class="spinner"></div><div class="loading-text">资源加载中…</div></div>
  </div>
  <script src="game.js"></script>
  <script src="runtime.js"></script>
</body>
</html>

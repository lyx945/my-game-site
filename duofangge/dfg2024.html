<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>躲方格2024</title>
<style>
  :root { --bg: #1a1d26; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #frame {
    position: relative;
    width: min(100vw, calc(100vh * 0.6888888889));
    aspect-ratio: 620 / 900;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.45);
  }
  #stage {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: pointer;
  }
  #bubbleLayer {
    position: absolute; inset: 0; pointer-events: none;
  }
  .bubble {
    position: absolute;
    background: #fff;
    color: #333;
    border: 2px solid #333;
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 13px;
    max-width: 240px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    white-space: pre-wrap;
    word-break: break-word;
    transform: translateX(-50%);
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%; bottom: -10px;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: #333;
  }
  #overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .dlg {
    background: #fff;
    border-radius: 16px;
    padding: 20px;
    width: 82%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .dlg-q {
    font-size: 15px;
    color: #222;
    margin-bottom: 14px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .dlg-input {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 12px;
    outline: none;
  }
  .dlg-input:focus { border-color: #6a8bff; }
  .dlg-btn {
    display: block;
    width: 100%;
    padding: 11px;
    font-size: 15px;
    border: none;
    border-radius: 10px;
    background: #5b7cfa;
    color: #fff;
    cursor: pointer;
    margin-top: 8px;
  }
  .dlg-btn:hover { background: #4a6af0; }
  .dlg-btn.choice { background: #fff; color: #333; border: 1.5px solid #5b7cfa; }
  .dlg-btn.choice:hover { background: #eef2ff; }
  #rankingPanel {
    position: absolute;
    right: 10px; top: 60px;
    background: rgba(255,255,255,0.95);
    border: 2px solid #333;
    border-radius: 12px;
    padding: 12px 16px;
    display: none;
    min-width: 160px;
    font-size: 14px;
    color: #222;
    z-index: 5;
  }
  #rankingPanel h3 { font-size: 14px; margin-bottom: 8px; text-align: center; }
  .rank-row { padding: 4px 0; border-bottom: 1px dashed #eee; }
  #timerDisplay {
    position: absolute;
    left: 10px; top: 10px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 14px;
    padding: 4px 8px;
    border-radius: 6px;
    display: none;
    font-variant-numeric: tabular-nums;
  }
  #varBox {
    position: absolute;
    left: 10px; top: 10px;
    display: none;
    z-index: 4;
  }
  .var {
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 13px;
    padding: 4px 9px;
    border-radius: 6px;
    margin-bottom: 5px;
  }
  .var span { opacity: 0.85; margin-right: 4px; }
</style>
</head>
<body>
  <div id="frame">
    <canvas id="stage"></canvas>
    <div id="bubbleLayer"></div>
    <div id="varBox"></div>
    <div id="timerDisplay"></div>
    <div id="rankingPanel"><h3>排行榜（本地）</h3><div id="rankingBody"></div></div>
    <div id="overlay"></div>
  </div>
  <!-- 全程 BGM：复用根目录 bgm4.mp3（文武贝《繁华的寂静》），独立于场景切换 -->
  <audio id="gameBgm" src="../bgm4.mp3" loop preload="auto"></audio>
  <script src="game.js"></script>
  <script src="runtime.js"></script>
  <script>
  (function(){
    var a = document.getElementById('gameBgm');
    if(!a) return;
    a.volume = 0.5;
    var started = false;
    function detach(){
      document.removeEventListener('pointerdown', start, true);
      document.removeEventListener('touchend', start, true);
      document.removeEventListener('keydown', start, true);
      document.removeEventListener('click', start, true);
    }
    function start(){
      if(started) return;
      try{
        var p = a.play();
        if(p && typeof p.then === 'function'){
          p.then(function(){ started = true; detach(); })
           .catch(function(){ /* 浏览器拒绝则保留监听，等待下一次用户手势重试 */ });
        }else{
          started = true; detach();
        }
      }catch(e){}
    }
    document.addEventListener('pointerdown', start, true);
    document.addEventListener('touchend', start, true);
    document.addEventListener('keydown', start, true);
    document.addEventListener('click', start, true);
  })();
  </script>
</body>
</html>
